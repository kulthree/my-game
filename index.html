<!DOCTYPE html>  
<html lang="th">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>ภารกิจพิชิตคำศัพท์ - ตารางหาคำศัพท์ภาษาไทย</title>  
  <script src="https://cdn.tailwindcss.com"></script>  
  <link rel="preconnect" href="https://fonts.googleapis.com">  
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">  
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>  
  <style>  
    body {  
      font-family: 'Kanit', 'Sarabun', sans-serif;  
      background-color: #f3f4f6;  
      color: #1f2937;  
    }  
      
    .printable-font {  
      font-family: 'Sarabun', 'Kanit', sans-serif;  
    }  
  
    /* Grid layout styling */  
    .grid-cell {  
      user-select: none;  
      -webkit-user-select: none;  
      transition: all 0.15s ease;  
    }  
  
    .grid-cell.selected {  
      background-color: #fde047 !important; /* Yellow-300 */  
      color: #854d0e !important;  
      transform: scale(1.05);  
      font-weight: 700;  
    }  
  
    .grid-cell.found {  
      background-color: #86efac !important; /* Green-300 */  
      color: #14532d !important;  
      font-weight: 700;  
    }  
  
    .grid-cell.answer-highlight {  
      background-color: #f43f5e !important; /* Rose-500 */  
      color: #ffffff !important;  
      font-weight: 700;  
      animation: pulse 1.5s infinite;  
    }  
  
    /* Print Specific Styling */  
    @media print {  
      @page {  
        size: A4 portrait;  
        margin: 10mm;  
      }  
        
      body {  
        background: white !important;  
        padding: 0 !important;  
        margin: 0 !important;  
      }  
  
      .no-print {  
        display: none !important;  
      }  
  
      .print-only {  
        display: block !important;  
      }  
  
      .a4-page {  
        width: 100% !important;  
        max-width: 100% !important;  
        height: auto !important;  
        min-height: 275mm !important;  
        box-shadow: none !important;  
        border: none !important;  
        padding: 0 !important;  
        margin: 0 !important;  
        page-break-after: always;  
        break-after: page;  
      }  
  
      .a4-page:last-child {  
        page-break-after: avoid;  
        break-after: avoid;  
      }  
  
      .print-grid {  
        gap: 2px !important;  
      }  
  
      .print-cell {  
        border: 1.5px solid #374151 !important;  
        font-size: 16pt !important;  
        font-weight: 600 !important;  
        color: #111827 !important;  
        background-color: #ffffff !important;  
      }  
  
      .print-cell-key {  
        background-color: #e0f2fe !important; /* Light sky blue for answer key */  
        border: 2px solid #0284c7 !important;  
        color: #0369a1 !important;  
        font-weight: 700 !important;  
      }  
  
      /* Print styles for interactive student inputs */  
      input::placeholder {  
        color: transparent !important;  
      }  
      input {  
        border-top: none !important;  
        border-left: none !important;  
        border-right: none !important;  
        border-bottom: 1.5px dotted #374151 !important;  
        background: transparent !important;  
        padding: 0 !important;  
        box-shadow: none !important;  
      }  
    }  
  
    @keyframes pulse {  
      0%, 100% { opacity: 1; }  
      50% { opacity: 0.7; }  
    }  
  </style>  
</head>  
<body class="min-h-screen pb-12">  
  
  <!-- Control Navigation Bar (Screen Only) -->  
  <header class="no-print bg-slate-800 text-white sticky top-0 z-50 shadow-md">  
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">  
      <div class="flex items-center gap-3">  
        <span class="text-2xl">📚</span>  
        <div>  
          <h1 class="font-bold text-lg leading-tight">ระบบเกมหาคำศัพท์ภาษาไทย</h1>  
          <p class="text-xs text-slate-300">ตาราง 12×12 ช่อง | 10 คำศัพท์ | 8 ทิศทาง</p>  
        </div>  
      </div>  
  
      <!-- Action Buttons -->  
      <div class="flex flex-wrap items-center gap-2">  
        <button id="timerToggleBtn" onclick="toggleTimer()" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-sm font-medium transition flex items-center gap-1.5">  
          <span>⏱️</span> <span id="timerText">05:00</span>  
        </button>  
        <button onclick="toggleAnswerKey()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition flex items-center gap-1.5">  
          <span>💡</span> <span>แสดง/ซ่อน เฉลย</span>  
        </button>  
        <button onclick="resetGame()" class="px-3 py-1.5 bg-slate-600 hover:bg-slate-700 text-white rounded-lg text-sm font-medium transition flex items-center gap-1.5">  
          <span>🔄</span> <span>รีเซ็ต</span>  
        </button>  
        <button onclick="window.print()" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-semibold transition flex items-center gap-1.5 shadow">  
          <span>🖨️</span> <span>พิมพ์ใบงาน A4 (หน้า 1 และ 2)</span>  
        </button>  
      </div>  
    </div>  
  </header>  
  
  <!-- Main Container -->  
  <main class="max-w-5xl mx-auto p-4 md:p-6 space-y-8">  
  
    <!-- ================= PAGE 1: STUDENT WORKSHEET / INTERACTIVE GAME ================= -->  
    <div id="page1" class="a4-page bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-slate-200 relative overflow-hidden">  
        
      <!-- Decorative Elements (Screen & Print) -->  
      <div class="absolute -top-10 -right-10 w-32 h-32 bg-amber-100 rounded-full blur-2xl pointer-events-none"></div>  
      <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-sky-100 rounded-full blur-2xl pointer-events-none"></div>  
  
      <!-- Header Section -->  
      <div class="border-b-2 border-amber-400 pb-4 mb-4">  
        <div class="flex justify-between items-start flex-wrap gap-4">  
          <div class="flex items-center gap-3">  
            <div class="p-3 bg-amber-500 text-white rounded-2xl shadow-lg no-print">  
              <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">  
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />  
              </svg>  
            </div>  
            <div>  
              <h2 class="text-2xl md:text-3xl font-extrabold text-slate-800 tracking-tight">ภารกิจพิชิตคำศัพท์</h2>  
              <p class="text-amber-700 font-medium text-sm md:text-base mt-0.5">ค้นหาคำศัพท์ทั้ง 10 คำที่ซ่อนอยู่ในตาราง (แนวนอน แนวตั้ง และแนวทแยง 8 ทิศทาง)</p>  
            </div>  
          </div>  
            
          <!-- Badge -->  
          <div class="bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-xl text-right">  
            <span class="text-xs text-amber-800 font-bold block">กลุ่มสาระการเรียนรู้ภาษาไทย</span>  
            <span class="text-xs text-slate-600">ระดับชั้นมัธยมศึกษาตอนปลาย - อุดมศึกษา (ปี 1)</span>  
          </div>  
        </div>  
  
        <!-- Student Info Header Block (For Printable Worksheet & Interactive Mode) -->  
        <div class="mt-4 pt-3 border-t border-dashed border-slate-300 grid grid-cols-12 gap-2 text-sm text-slate-700 printable-font">  
          <div class="col-span-12 sm:col-span-6 flex items-center">  
            <label for="studentName" class="font-semibold whitespace-nowrap">ชื่อ-นามสกุล:</label>  
            <input type="text" id="studentName" placeholder="พิมพ์ชื่อ-นามสกุลที่นี่..." class="ml-2 px-2 py-0.5 border-b-2 border-dotted border-slate-400 focus:border-amber-500 focus:outline-none flex-grow bg-slate-50/80 focus:bg-white rounded-t text-slate-800 font-medium transition-colors">  
          </div>  
          <div class="col-span-6 sm:col-span-3 flex items-center">  
            <label for="studentClass" class="font-semibold whitespace-nowrap">ชั้น:</label>  
            <input type="text" id="studentClass" placeholder="ป.X/X" class="ml-2 px-2 py-0.5 border-b-2 border-dotted border-slate-400 focus:border-amber-500 focus:outline-none flex-grow bg-slate-50/80 focus:bg-white rounded-t text-slate-800 font-medium transition-colors">  
          </div>  
          <div class="col-span-6 sm:col-span-3 flex items-center">  
            <label for="studentNo" class="font-semibold whitespace-nowrap">เลขที่:</label>  
            <input type="text" id="studentNo" placeholder="XX" class="ml-2 px-2 py-0.5 border-b-2 border-dotted border-slate-400 focus:border-amber-500 focus:outline-none flex-grow bg-slate-50/80 focus:bg-white rounded-t text-slate-800 font-medium transition-colors">  
          </div>  
          <div class="col-span-12 sm:col-span-6 flex items-center mt-1">  
            <label for="studentDate" class="font-semibold whitespace-nowrap">วันที่:</label>  
            <input type="text" id="studentDate" placeholder="วว/มม/ปปปป" class="ml-2 px-2 py-0.5 border-b-2 border-dotted border-slate-400 focus:border-amber-500 focus:outline-none flex-grow bg-slate-50/80 focus:bg-white rounded-t text-slate-800 font-medium transition-colors">  
          </div>  
          <div class="col-span-12 sm:col-span-6 flex items-center mt-1">  
            <span class="font-semibold whitespace-nowrap">คะแนนที่ได้:</span>  
            <span id="scoreInHeader" class="border-b border-dotted border-slate-500 w-12 text-center font-bold text-emerald-600 ml-2">0</span>
